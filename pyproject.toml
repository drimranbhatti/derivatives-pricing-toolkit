[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "derivpricer"
version = "1.0.0"
description = "Option pricing toolkit: Black-Scholes, binomial trees, Monte Carlo, Heston, Merton, Bates and short-rate models"
authors = [{ name = "Dr. Muhammad Imran Bhatti" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0"]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.8", "yfinance>=0.2.40", "jupyter"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
